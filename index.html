<script>
  // Bridge: the page asks for a "db"; Firebase answers it.
  window.__fbReady = new Promise(r => { window.__fbResolve = r; });
  window.claude = { use: n => n === "db" ? window.__fbReady : Promise.resolve(null) };
</script>
<script type="module">
  const cfg = window.FIREBASE_CONFIG || {};
  if (!cfg.databaseURL || cfg.databaseURL.includes("PASTE")) {
    window.__fbResolve(null);              // not set up yet: page runs in solo mode
  } else {
    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      const { getDatabase, ref, onValue, set, update, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
      const db = getDatabase(initializeApp(cfg));
      window.__fbResolve({
        collection: name => ({
          onSnapshot(next, onErr) {
            return onValue(ref(db, name), s => {
              const v = s.val() || {};
              next({ docs: Object.entries(v).map(([id, d]) => ({ id, exists: true, data: () => d })) });
            }, e => onErr && onErr(e));
          }
        }),
        doc: path => ({ set: v => set(ref(db, path), v) }),
        // Wipes every count in one write. Firebase only accepts it when the
        // password matches the secret stored in the database (see rules file).
        newRound: pw => update(ref(db), { players: null, lastReset: { at: serverTimestamp(), key: pw } })
      });
    } catch (e) { window.__fbResolve(null); }
  }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Serif:wght@800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --azure:#1E3F7A; --azure-deep:#142B55; --azure-mid:#2A4F8E;
    --gold:#E2B33C; --rice:#FBF8F2; --nori:#1C2620; --ink:#E9EEF7;
    --p-maki:#2F8F5B; --p-nigiri:#D9483B; --p-app:#B8741A; --p-sashimi:#F3EDE2; --p-other:#6B5BA8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--azure)}
  html{min-height:100%}
  body{font-family:"Zen Kaku Gothic New",system-ui,sans-serif;background:var(--azure);color:var(--ink);
    min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:480px;margin:0 auto;padding:20px 18px 40px}
  button,input{font:inherit}
  button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  header{display:flex;justify-content:center}
  /* wordmark: the ATΩ logo with "OinkOink" set in a matching navy serif */
  .badge{background:var(--rice);border-radius:16px;padding:.32em .5em .26em;
    font-size:clamp(34px,11vw,50px);line-height:1;white-space:nowrap;margin:0}
  .badge img{height:.7em;width:auto;vertical-align:baseline}
  .badge span{font-family:"Noto Serif",Georgia,"Times New Roman",serif;font-weight:800;
    color:var(--azure);letter-spacing:-.01em;margin-left:.02em}

  /* join */
  .join{margin-top:40px}
  .join h2{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:30px;line-height:1.15;margin:0 0 18px}
  .join p{margin:0 0 20px;opacity:.8;line-height:1.5}
  .join input{width:100%;padding:16px;border-radius:14px;border:0;font-size:18px;background:var(--rice);color:var(--nori)}
  .join .err{color:#FFB4AB;font-size:14px;min-height:20px;margin:8px 0}
  .primary{width:100%;padding:16px;border-radius:14px;border:0;background:var(--gold);color:var(--nori);font-weight:700;font-size:18px;cursor:pointer}

  /* counter */
  .counter{margin:22px 0 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:stretch;
    background:var(--azure-deep);border-radius:22px;padding:18px 18px 16px;min-height:210px}
  .who{font-size:15px;opacity:.85;margin-bottom:6px}
  .who button{background:none;border:0;color:var(--gold);text-decoration:underline;padding:0;cursor:pointer;font-size:14px;margin-left:6px}
  .total{font-family:"Dela Gothic One",sans-serif;font-size:96px;line-height:.9;color:var(--gold)}
  .total-label{font-size:15px;margin-top:8px;opacity:.85}
  .standing{font-size:15px;margin-top:10px;font-weight:700;min-height:20px}
  .stack{height:170px;display:flex;flex-direction:column-reverse;align-items:center;overflow:hidden}
  .plate{width:96px;height:14px;border-radius:50%;flex:none;margin-top:-5px;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.15)}
  .plate.drop{animation:drop .28s cubic-bezier(.3,1.5,.6,1)}
  @keyframes drop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
  .counter > div:first-child{display:flex;flex-direction:column;justify-content:flex-end}
  .top3{border-left:1px solid rgba(233,238,247,.15);padding-left:14px;display:flex;flex-direction:column}
  .top3-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin-bottom:8px}
  .top3 ol{display:grid;gap:6px}
  .top3 li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;
    padding:7px 8px;border-radius:10px;background:rgba(255,255,255,.06)}
  .top3 li.me{outline:2px solid var(--gold)}
  .top3 li.gap{background:none;padding:0 8px;font-size:12px;opacity:.5;display:block;text-align:center}
  .medal{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
    font-family:"Dela Gothic One",sans-serif;font-size:12px;color:var(--nori);background:var(--m)}
  .t-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t-n{font-family:"Dela Gothic One",sans-serif;font-size:18px}
  .top3 .none{font-size:14px;opacity:.6;background:none;display:block;padding:0}

  .menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .menu .item{min-width:0}
  .item{color:var(--nori);border:0;cursor:pointer;background:var(--rice);border-radius:18px;
    padding:14px 14px 14px 12px;display:flex;align-items:center;gap:12px;text-align:left;min-height:84px;transition:transform .08s}
  .item:active{transform:scale(.96)}
  .dish{width:48px;height:48px;border-radius:50%;flex:none;
    box-shadow:inset 0 0 0 5px rgba(255,255,255,.35),inset 0 -4px 0 5px rgba(0,0,0,.12)}
  .dish{position:relative}
  .dish img{position:absolute;left:50%;top:44%;width:120%;height:120%;object-fit:contain;transform:translate(-50%,-50%);
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.3));pointer-events:none}
  .item .name{font-weight:700;font-size:17px;display:block;overflow:hidden;text-overflow:ellipsis}
  .item .count{font-size:14px;opacity:.65}
  .item.bump .dish{animation:bump .25s}
  @keyframes bump{50%{transform:scale(1.18)}}

  .actions{display:flex;gap:10px;margin-top:16px}
  .actions button{flex:1;font-weight:700;font-size:16px;padding:14px;border-radius:14px;cursor:pointer;
    background:transparent;color:var(--ink);border:2px solid rgba(233,238,247,.35)}
  .actions button:disabled{opacity:.35;cursor:default}
  .actions .confirm{background:var(--p-nigiri);border-color:var(--p-nigiri)}

  /* leaderboard */
  .board{margin-top:34px}
  .board-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .board h2{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:24px;margin:0}
  .sync{font-size:13px;opacity:.65}
  .table-total{font-size:15px;opacity:.85;margin:-4px 0 14px}
  ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  li.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;
    background:var(--azure-mid);border-radius:14px;padding:12px 14px}
  li.row.me{outline:2px solid var(--gold)}
  li.row.first{background:var(--gold);color:var(--nori)}
  .rank{font-family:"Dela Gothic One",sans-serif;font-size:20px;text-align:center}
  .pname{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pname small{font-weight:400;opacity:.7;margin-left:4px}
  .mini{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px;background:rgba(0,0,0,.2)}
  .pcount{font-family:"Dela Gothic One",sans-serif;font-size:26px}
  .empty{font-family:"Dela Gothic One",sans-serif;color:var(--gold);font-size:22px;line-height:1.25;padding:10px 0}
  .round{margin-top:28px;border-top:1px solid rgba(233,238,247,.15);padding-top:16px}
  .round-open,.round-cancel{background:none;border:0;color:var(--ink);opacity:.7;text-decoration:underline;cursor:pointer;padding:6px 0;font-size:15px}
  .round-form label{display:block;font-size:14px;opacity:.85;margin-bottom:8px}
  .round-row{display:flex;gap:8px}
  .round-row input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:0;font-size:16px;background:var(--rice);color:var(--nori)}
  .round-row button{padding:12px 16px;border-radius:12px;border:0;background:var(--p-nigiri);color:#fff;font-weight:700;cursor:pointer}
  .round-row button:disabled{opacity:.5}
  .round-cancel{margin-top:6px}
  .round-msg{font-size:14px;margin-top:8px;min-height:18px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;opacity:.8;margin-top:14px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:-1px}

  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){.plate.drop,.item.bump .dish{animation:none}.item{transition:none}}
</style>
</head>

  <!-- Join -->
  <section class="join" id="joinView" hidden>
    <h2>Hello brother</h2>
    <input id="nameInput" maxlength="20" placeholder="Your name" autocomplete="off" autocapitalize="words" enterkeyhint="go">
    <div class="err" id="joinErr" role="alert"></div>
    <button class="primary" id="joinBtn">JOIN</button>
  </section>

  <!-- Counter -->
  <main id="mainView" hidden>
    <section class="counter" aria-live="polite">
      <div>
        <div class="who"><span id="meName"></span><button id="switchBtn">Not you?</button></div>
        <div class="total" id="total">0</div>
        <div class="total-label" id="totalLabel">pieces down</div>
        <div class="standing" id="standing"></div>
      </div>
      <div class="top3">
        <div class="top3-title">Top 3</div>
        <ol id="top3"></ol>
      </div>
    </section>

    <div class="menu" id="menu"></div>

    <div class="actions">
      <button id="undo" disabled>Undo last</button>
      <button id="reset" disabled>Start over</button>
    </div>
  </main>

  <!-- Leaderboard -->
  <section class="board" id="boardView" hidden>
    <div class="board-head">
      <h2>Leaderboard</h2>
      <span class="sync" id="sync">Loading…</span>
    </div>
    <div class="table-total" id="tableTotal"></div>
    <ol id="board"></ol>
    <div class="legend" id="legend"></div>
    <div class="round" id="round" hidden>
      <button class="round-open" id="roundOpen">New round</button>
      <form class="round-form" id="roundForm" hidden>
        <label for="roundPw">Password to clear everyone's count</label>
        <div class="round-row">
          <input id="roundPw" type="password" autocomplete="off" enterkeyhint="go">
          <button type="submit" id="roundGo">Clear board</button>
        </div>
        <button type="button" class="round-cancel" id="roundCancel">Cancel</button>
      </form>
      <div class="round-msg" id="roundMsg" role="status"></div>
    </div>
  </section>

const $ = id => document.getElementById(id);

let me = null;          // {key, name}
let history = [];       // my pieces, in order
let players = [];       // everyone, from shared storage
let lastSync = 0;

const slug = s => s.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const colorOf = id => (ITEMS.find(x=>x.id===id)||{color:"#888"}).color;
const tally = h => { const c = Object.fromEntries(ITEMS.map(i=>[i.id,0])); h.forEach(id=>{ if(id in c) c[id]++; }); return c; };
const esc = s => s.replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

/* ---------- shared storage (artifact db) ---------- */
let db = null, live = false;
const LS = "ato-nijiya:me";
const lsGet = () => { try{ return JSON.parse(localStorage.getItem(LS)); }catch(e){ return null; } };
const lsSet = v => { try{ v ? localStorage.setItem(LS, JSON.stringify(v)) : localStorage.removeItem(LS); }catch(e){} };

function onPlayers(snap){
  players = snap.docs.map(d => ({key:d.id, ...d.data()}));
  lastSync = Date.now(); live = true;
  if(me){ // my own count stays authoritative on this phone
    const mine = players.find(p=>p.key===me.key);
    if(mine){ seenMine = true; mine.history = history; }
    else if(seenMine && !saving && !dirty){
      // my row was wiped on the server: new round, start this phone at 0
      seenMine = false; history = []; clearTimeout(saveTimer);
      players.push({key:me.key,name:me.name,history}); renderMe(); return;
    }
    else players.push({key:me.key,name:me.name,history});
  }
  renderBoard();
}
let seenMine = false;

let saveTimer, saving = false, dirty = false;
function saveMe(){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 400); } // batch quick taps
async function flush(){
  if(!db || !me) return;
  if(saving){ dirty = true; return; }       // one write at a time
  saving = true; dirty = false;
  try{ await db.doc("players/"+me.key).set({name:me.name, history:[...history], updated:Date.now()}); }
  catch(e){ $("sync").textContent = e && e.code==="invalid_argument" ? "Board is locked, check Firebase rules" : "Couldn't save, retrying"; dirty = true; }
  saving = false;
  if(dirty) setTimeout(flush, 800);
}

/* ---------- join ---------- */
async function join(){
  const name = $("nameInput").value.trim();
  const s = slug(name);
  if(!s){ $("joinErr").textContent = "Enter a name with at least one letter or number."; return; }
  me = {key: s.slice(0,60), name};
  const existing = players.find(p=>p.key===me.key); // same name on a new phone picks up the count
  history = existing ? [...(existing.history||[])] : [];
  lsSet(me); saveMe(); showMain();
}
$("joinBtn").addEventListener("click", join);
$("nameInput").addEventListener("keydown", e=>{ if(e.key==="Enter") join(); });

$("switchBtn").addEventListener("click", ()=>{
  me = null; history = []; seenMine = false; lsSet(null);
  $("nameInput").value = ""; showJoin();
});

function showJoin(){ $("joinView").hidden=false; $("mainView").hidden=true; $("boardView").hidden=false; $("nameInput").focus(); renderBoard(); }
function showMain(){ $("joinView").hidden=true; $("mainView").hidden=false; $("boardView").hidden=false; $("meName").textContent = me.name; renderMe(); }

/* ---------- my counter ---------- */
ITEMS.forEach(it=>{
  const b = document.createElement("button");
  b.className = "item";
  b.innerHTML = `<span class="dish${it.img?" has-food":""}" style="background:${it.color}">${it.img?`<img src="${it.img}" alt="">`:""}</span>
    <span><span class="name">${it.name}</span><span class="count" id="c-${it.id}">0 eaten</span></span>`;
  b.addEventListener("click", ()=>{
    history.push(it.id);
    b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump");
    if(navigator.vibrate) navigator.vibrate(12);
    renderMe(true); saveMe();
  });
  $("menu").appendChild(b);
});

$("undo").addEventListener("click", ()=>{ history.pop(); renderMe(); saveMe(); });

let resetTimer;
$("reset").addEventListener("click", e=>{
  const btn = e.currentTarget;
  if(!btn.classList.contains("confirm")){
    btn.classList.add("confirm"); btn.textContent = "Tap again to clear";
    resetTimer = setTimeout(()=>{ btn.classList.remove("confirm"); btn.textContent = "Start over"; }, 3000);
    return;
  }
  clearTimeout(resetTimer); btn.classList.remove("confirm"); btn.textContent = "Start over";
  history = []; renderMe(); saveMe();
});

/* ---------- new round (password checked by Firebase) ---------- */
function showRoundForm(open){
  $("roundForm").hidden = !open; $("roundOpen").hidden = open;
  if(open){ $("roundPw").value = ""; $("roundMsg").textContent = ""; $("roundPw").focus(); }
}
$("roundOpen").addEventListener("click", ()=>showRoundForm(true));
$("roundCancel").addEventListener("click", ()=>showRoundForm(false));
$("roundForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const pw = $("roundPw").value;
  if(!pw){ $("roundMsg").textContent = "Enter the password."; return; }
  $("roundGo").disabled = true; $("roundMsg").textContent = "Clearing…";
  try{
    await db.newRound(pw);
    clearTimeout(saveTimer); dirty = false; seenMine = false; history = []; renderMe();
    showRoundForm(false); $("roundMsg").textContent = "New round started. Everyone is back to 0.";
  }catch(err){
    $("roundMsg").textContent = "Wrong password. The board wasn't changed.";
    $("roundPw").select();
  }
  $("roundGo").disabled = false;
});

function renderMe(dropped){
  const c = tally(history), n = history.length;
  $("total").textContent = n;
  $("totalLabel").textContent = n===1 ? "piece down" : "pieces down";
  ITEMS.forEach(it => $("c-"+it.id).textContent = `${c[it.id]} eaten`);
  $("undo").disabled = $("reset").disabled = !n;
  if(me){ const mine = players.find(p=>p.key===me.key); if(mine) mine.history = history; else players.push({key:me.key,name:me.name,history}); }
  renderBoard();
}

/* ---------- leaderboard ---------- */
function ranked(){
  return players.map(p=>({...p, n:(p.history||[]).length}))
    .sort((a,b)=> b.n-a.n || a.name.localeCompare(b.name));
}

function renderBoard(){
  const list = ranked();
  const el = $("board");
  const tableN = list.reduce((s,p)=>s+p.n,0);
  $("tableTotal").textContent = list.length ? `${tableN} pieces across ${list.length} ${list.length===1?"person":"people"}` : "";
  if(!list.length){ el.innerHTML = `<li class="empty">WHICH BROTHER CAN EAT THE MOST?!!!</li>`; }
  else {
    // shared ranks for ties
    let rank = 0, prev = null;
    el.innerHTML = list.map((p,i)=>{
      if(p.n !== prev){ rank = i+1; prev = p.n; }
      const c = tally(p.history||[]);
      const isMe = me && p.key===me.key;
      const cls = ["row", rank===1 && p.n>0 ? "first":"", isMe?"me":""].join(" ");
      const bar = ITEMS.map(it=>`<span style="background:${it.color};flex-grow:${c[it.id]}"></span>`).join("");
      return `<li class="${cls}">
        <span class="rank">${rank}</span>
        <div><div class="pname">${esc(p.name)}${isMe?"<small>you</small>":""}</div><div class="mini">${bar}</div></div>
        <span class="pcount">${p.n}</span></li>`;
    }).join("");
  }
  renderTop3(list);
  // where do I stand?
  if(me){
    const mineN = history.length;
    const others = list.filter(p=>p.key!==me.key);
    const top = others[0];
    let msg = "";
    if(!others.length) msg = "Waiting for brothers.";
    else if(mineN===0) msg = `${esc(top.name)} leads with ${top.n}.`;
    else if(!top || mineN > top.n) msg = `You're in the lead by ${mineN-(top?top.n:0)}.`;
    else if(mineN === top.n) msg = `Tied with ${esc(top.name)} for first.`;
    else msg = `${top.n-mineN} behind ${esc(top.name)}.`;
    $("standing").innerHTML = msg;
  }
  updateSync();
}

function renderTop3(list){
  const el = $("top3"), MEDALS = ["var(--gold)","#C9CED8","#C98A55"];
  const live = list.filter(p=>p.n>0);
  if(!live.length){ el.innerHTML = `<li class="none">First piece takes the crown.</li>`; return; }
  let rank=0, prev=null;
  const withRank = live.map((p,i)=>{ if(p.n!==prev){rank=i+1;prev=p.n;} return {...p,rank}; });
  const row = p => `<li class="${me&&p.key===me.key?"me":""}"><span class="medal" style="--m:${MEDALS[p.rank-1]||"rgba(233,238,247,.35)"}">${p.rank}</span>
    <span class="t-name">${esc(p.name)}</span><span class="t-n">${p.n}</span></li>`;
  let html = withRank.slice(0,3).map(row).join("");
  const mine = me && withRank.findIndex(p=>p.key===me.key);
  if(me && mine > 2){ html += `<li class="gap">⋯</li>` + row(withRank[mine]); }
  el.innerHTML = html;
}

function updateSync(){
  if(!live){ $("sync").textContent = db ? "Connecting…" : "Solo mode"; return; }
  const s = Math.round((Date.now()-lastSync)/1000);
  $("sync").textContent = s < 45 ? "Live" : `Updated ${Math.round(s/60)||1}m ago`;
}

$("legend").innerHTML = ITEMS.map(it=>`<span style="--c:${it.color}">${it.name}</span>`).join("");

/* ---------- start ---------- */
(function init(){
  const saved = lsGet();
  if(saved && saved.key){ me = saved; showMain(); } else showJoin();
  setInterval(updateSync, 1000);
  (window.claude ? window.claude.use("db") : Promise.resolve(null)).then(d=>{
    db = d; updateSync(); if(!db) return;
    $("round").hidden = !db.newRound;
    let first = true;
    db.collection("players").onSnapshot(snap=>{
      if(first && me){ // returning on this phone: restore count from the board
        first = false;
        const mine = snap.docs.find(x=>x.id===me.key);
        if(mine && !history.length){ history = [...(mine.data().history||[])]; renderMe(); }
      }
      first = false; onPlayers(snap);
    }, ()=>{ live = false; $("sync").textContent = "Board offline, reload"; });
    if(me && history.length) saveMe();
  }).catch(()=>{});
})();
</script>
